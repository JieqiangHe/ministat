<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Free in-browser statistics and scientific graphing: t-tests, Mann–Whitney, Wilcoxon, ANOVA, Kruskal–Wallis, post-hoc tests and publication-ready plots." />
<title>ministat — Statistics &amp; Scientific Graphing</title>
<link rel="stylesheet" href="styles.css" />
</head>

<body class="bg-black text-neutral-200 min-h-screen">
  <main class="max-w-[1100px] mx-auto p-3 flex flex-col gap-3">

    <!-- ============ DATA ============ -->
    <section id="sec-data" class="bg-black rounded-xl border border-neutral-800 p-3">
      <div class="flex items-center justify-between mb-2 flex-wrap gap-1.5">
        <h2 class="font-semibold text-neutral-100 flex items-center gap-2">Data</h2>
        <div class="flex gap-1.5 flex-wrap">
          <button id="undoBtn" class="tb-btn" title="Undo (⌘/Ctrl+Z)" disabled>↶ Undo</button>
          <button id="redoBtn" class="tb-btn" title="Redo (⌘/Ctrl+Shift+Z)" disabled>↷ Redo</button>
          <button id="addRowBtn" class="tb-btn">+ Row</button>
          <button id="addGroupBtn" class="tb-btn">+ Group</button>
          <button id="clearBtn" class="tb-btn hover:bg-red-900 hover:text-red-200">✕ Clear</button>
          <button id="exportBtn" class="tb-btn">⬇ Export .jgz</button>
          <label for="importJH" id="importLabel" class="tb-btn cursor-pointer">⬆ Import .jgz</label>
          <input id="importJH" type="file" accept=".jgz,.jh" class="hidden" />
        </div>
      </div>

      <div class="overflow-auto scroll-thin border border-neutral-700 rounded-lg" style="max-height: 360px;">
        <table class="data-grid text-sm" id="dataTable" aria-label="Data grid"></table>
      </div>
      <p class="mt-1.5 text-[11px] text-neutral-400">Tip: paste a block from Excel/Sheets into any cell (⌘/Ctrl+V). Enter / ↑ ↓ move between rows, ← → between groups at the edge of a cell. Hover a row number to delete the row.</p>

      <div id="parseWarn" class="hidden mt-2 text-xs text-amber-300 bg-amber-500/10 border border-amber-500/30 rounded-md px-3 py-2" role="status"></div>

      <details class="mt-2">
        <summary class="text-xs font-medium text-neutral-400 hover:text-neutral-200 select-none">⌗ Paste / import TSV or CSV (from Excel, Sheets…)</summary>
        <div class="mt-2">
          <label for="pasteBox" class="sr-only">Delimited data to import</label>
          <textarea id="pasteBox" rows="5" placeholder="Optionally include a header row of group names.&#10;Control&#9;Drug A&#9;Drug B&#10;5.1&#9;7.2&#9;9.8&#10;4.8&#9;6.9&#9;10.2" class="w-full text-xs font-mono border border-neutral-700 rounded-md p-2 bg-neutral-800 text-neutral-100 focus:outline-none focus:border-neutral-400"></textarea>
          <div class="flex gap-2 mt-2">
            <button id="importBtn" class="tb-btn px-3">Import into grid</button>
            <button id="loadDemoBtn" class="tb-btn px-3">Reset to demo data</button>
          </div>
        </div>
      </details>
    </section>

    <!-- ============ ANALYSIS SETTINGS ============ -->
    <section id="sec-settings" class="bg-black rounded-xl border border-neutral-800 p-3">
      <h2 class="font-semibold text-neutral-100 flex items-center gap-2 mb-2">Analysis</h2>

      <label for="testSelect" class="field-label">Test</label>
      <select id="testSelect" class="field mb-2">
        <optgroup label="Two groups — independent">
          <option value="ttest">Unpaired t-test (Student's / Welch's)</option>
          <option value="mwu">Mann–Whitney U / Wilcoxon rank-sum</option>
        </optgroup>
        <optgroup label="Two groups — paired (matched rows)">
          <option value="paired">Paired t-test</option>
          <option value="wilcoxon">Wilcoxon signed-rank</option>
        </optgroup>
        <optgroup label="Two or more groups">
          <option value="anova">One-way ANOVA + post-hoc</option>
          <option value="kruskal">Kruskal–Wallis + Dunn's post-hoc</option>
        </optgroup>
      </select>

      <div id="opt_ttest" class="test-opts">
        <label class="flex items-center gap-2 text-sm mb-2">
          <input type="checkbox" id="welchChk" class="accent-neutral-400" checked />
          <span>Welch's correction <span class="text-neutral-400">(recommended; does not assume equal variances)</span></span>
        </label>
      </div>

      <div id="opt_anova" class="test-opts hidden">
        <label for="posthocSelect" class="field-label">Post-hoc test</label>
        <select id="posthocSelect" class="field mb-2">
          <option value="tukey">Tukey's HSD (all pairs)</option>
          <option value="holm">Holm pairwise t-tests (all pairs)</option>
          <option value="bonferroni">Bonferroni pairwise t-tests (all pairs)</option>
          <option value="dunnett">Dunnett (each group vs. the first group)</option>
        </select>
      </div>

      <div id="opt_kruskal" class="test-opts hidden">
        <label for="dunnAdj" class="field-label">Dunn's test p-value adjustment</label>
        <select id="dunnAdj" class="field mb-2">
          <option value="holm">Holm</option>
          <option value="bonferroni">Bonferroni</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-2 mt-2">
        <div>
          <label for="chartType" class="field-label">Chart type</label>
          <select id="chartType" class="field">
            <option value="bar">Bar + error bars</option>
            <option value="box">Box &amp; whisker</option>
          </select>
        </div>
        <div>
          <label for="errType" class="field-label">Error bars</label>
          <select id="errType" class="field">
            <option value="sd">Mean ± SD</option>
            <option value="sem" selected>Mean ± SEM</option>
            <option value="ci">Mean ± 95% CI</option>
          </select>
        </div>
        <div>
          <label for="themeSelect" class="field-label">Theme</label>
          <select id="themeSelect" class="field">
            <option value="prism">Classic Prism</option>
            <option value="pastel">Pastel</option>
            <option value="vibrant">Vibrant</option>
          </select>
        </div>
        <div>
          <label for="sigLabel" class="field-label">Significance</label>
          <select id="sigLabel" class="field">
            <option value="stars">Asterisks (*)</option>
            <option value="pval">p-value</option>
          </select>
        </div>
        <div>
          <label for="xLabel" class="field-label">X-axis title</label>
          <input id="xLabel" value="Group" class="field" />
        </div>
        <div>
          <label for="yLabel" class="field-label">Y-axis title</label>
          <input id="yLabel" value="Value" class="field" />
        </div>
      </div>

      <button id="runBtn" class="w-full mt-3 py-2 rounded-lg bg-neutral-200 text-neutral-900 font-semibold hover:bg-white active:scale-[.99] transition">
        Analyze ▸
      </button>
    </section>

    <!-- ============ REPORT ============ -->
    <section id="sec-report" class="bg-black rounded-xl border border-neutral-800 p-3">
      <div class="flex items-center justify-between mb-2">
        <h2 class="font-semibold text-neutral-100">Stat</h2>
        <button id="copyStats" class="tb-btn">⧉ Copy table</button>
      </div>
      <div id="verdict" class="mb-2"></div>
      <div id="report" class="space-y-3 overflow-x-auto scroll-thin"></div>
    </section>

    <!-- ============ FIGURE ============ -->
    <section id="sec-graph" class="bg-black rounded-xl border border-neutral-800 p-3">
      <div class="flex items-center justify-between mb-2 flex-wrap gap-1.5">
        <h2 class="font-semibold text-neutral-100 flex items-center gap-2">Figure</h2>
        <div class="flex items-center gap-1.5 flex-wrap justify-end">
          <div class="flex items-center gap-1 text-xs text-neutral-500 mr-1">
            <label for="plotW">W</label><input id="plotW" type="number" min="220" step="20" value="300" class="num-field w-14" />
            <label for="plotH">H</label><input id="plotH" type="number" min="220" step="20" value="400" class="num-field w-14" />
            <label for="dotSize">Dot</label><input id="dotSize" type="number" min="2" max="20" step="1" value="6" class="num-field w-12" />
            <span class="text-neutral-400">px</span>
          </div>
          <button id="resetGraph" class="tb-btn" title="Restore graph to default options, size &amp; view">↺ Reset</button>
          <button id="dlPng" class="tb-btn" title="PNG at 5× the on-screen size (≈ 300 dpi for a 2–3 inch figure)">⬇ PNG</button>
          <button id="dlSvg" class="tb-btn">⬇ SVG</button>
        </div>
      </div>
      <div id="plot" class="w-full" style="height: 400px;"></div>
    </section>
  </main>

<script src="https://cdn.jsdelivr.net/npm/jstat@1.9.6/dist/jstat.min.js" integrity="sha384-7uGOMhLhjroTamet5l69PR8EGxKUyWZlZOFFDRymtVqIfsh4Hj7uZRctW67ZCdkD" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-cartesian-dist-min@2.35.2/plotly-cartesian.min.js" integrity="sha384-gKF7EaMDoWW1zLWkouldmVWF5jqEKrAswAciW73iNzqlomabVVPO60XkJvL5q/Ie" crossorigin="anonymous"></script>
<script src="stats.js"></script>
<script src="app.js"></script>
</body>
</html>
